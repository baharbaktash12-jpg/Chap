<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | چاپخانه ایران سروش</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<!-- ===================== صفحه ورود ===================== -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <span class="brand-title" style="font-family:var(--font-nastaliq); color:var(--turquoise-deep);">ایران سروش</span>
    <p>ورود به پنل مدیریت سایت</p>
    <form id="loginForm">
      <div class="form-row" style="text-align:right">
        <label>رمز عبور</label>
        <input type="password" id="loginPass" required autofocus>
      </div>
      <button class="btn btn-block" type="submit">ورود</button>
      <div id="loginMsg" style="margin-top:14px"></div>
    </form>
    <div class="login-hint">رمز پیش‌فرض: admin123 — پس از ورود آن را از تب «تنظیمات» تغییر دهید.</div>
  </div>
</div>

<!-- ===================== داشبورد ===================== -->
<div id="dashboard" style="display:none">
  <div class="admin-topbar">
    <span class="brand-title" id="dashBrand">پنل مدیریت ایران سروش</span>
    <div class="actions">
      <a class="view-site" href="index.html" target="_blank">مشاهده سایت ↗</a>
      <button class="btn btn-outline btn-sm" style="background:#fff" id="logoutBtn">خروج</button>
    </div>
  </div>

  <div class="admin-shell">
    <div class="tabs">
      <button class="tab-btn active" data-tab="tabHero">بنر و تجهیزات</button>
      <button class="tab-btn" data-tab="tabCats">محصولات و قیمت‌ها</button>
      <button class="tab-btn" data-tab="tabFaq">سوالات متداول</button>
      <button class="tab-btn" data-tab="tabContact">اطلاعات تماس</button>
      <button class="tab-btn" data-tab="tabSettings">تنظیمات / رمز عبور</button>
    </div>

    <!-- بنر و تجهیزات -->
    <div class="tab-panel active" id="tabHero">
      <h3>بنر و تجهیزات</h3>
      <form id="heroForm">
        <div class="form-row"><label>نام سایت (فونت نستعلیق)</label><input type="text" id="heroSiteName"></div>
        <div class="form-row"><label>شعار / تگ‌لاین</label><input type="text" id="heroTagline"></div>
        <label style="font-weight:700;color:var(--turquoise-deep);display:block;margin:18px 0 10px;">تجهیزات و امکانات نمایش‌داده‌شده در بنر</label>
        <div id="equipList"></div>
        <button type="button" class="btn btn-outline btn-sm" id="addEquipBtn" style="margin-bottom:16px">+ افزودن ویژگی</button>
        <button class="btn btn-block" type="submit">ذخیره تغییرات بنر</button>
        <div id="heroMsg" style="margin-top:14px"></div>
      </form>
    </div>

    <!-- محصولات -->
    <div class="tab-panel" id="tabCats">
      <h3>محصولات، قیمت‌ها و تصاویر</h3>
      <div id="catAdminList"></div>
      <button type="button" class="btn btn-outline" id="addCatBtn">+ افزودن دسته جدید</button>
      <div id="catMsg" style="margin-top:14px"></div>
    </div>

    <!-- سوالات متداول -->
    <div class="tab-panel" id="tabFaq">
      <h3>سوالات متداول</h3>
      <div id="faqAdminList"></div>
      <button type="button" class="btn btn-outline" id="addFaqBtn">+ افزودن سوال جدید</button>
      <div id="faqMsg" style="margin-top:14px"></div>
    </div>

    <!-- اطلاعات تماس -->
    <div class="tab-panel" id="tabContact">
      <h3>اطلاعات تماس</h3>
      <form id="contactForm">
        <div class="form-row"><label>شماره تماس</label><input type="text" id="cPhone"></div>
        <div class="form-row"><label>آدرس</label><input type="text" id="cAddress"></div>
        <div class="form-row"><label>لینک واتساپ</label><input type="text" id="cWhatsapp"></div>
        <div class="form-row"><label>لینک تلگرام</label><input type="text" id="cTelegram"></div>
        <button class="btn btn-block" type="submit">ذخیره اطلاعات تماس</button>
        <div id="contactMsg" style="margin-top:14px"></div>
      </form>
    </div>

    <!-- تنظیمات / رمز عبور -->
    <div class="tab-panel" id="tabSettings">
      <h3>تغییر رمز عبور پنل مدیریت</h3>
      <form id="passForm">
        <div class="form-row"><label>رمز فعلی</label><input type="password" id="curPass" required></div>
        <div class="form-row"><label>رمز جدید</label><input type="password" id="newPass" required></div>
        <button class="btn btn-block" type="submit">تغییر رمز عبور</button>
        <div id="passMsg" style="margin-top:14px"></div>
      </form>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
